name: prod-deploy

on:
  workflow_dispatch:
    inputs:
      major:
        description: "メジャーバージョン X（指定時は X.0.0）"
        required: false
        type: string
      minor:
        description: "マイナーバージョン Y（指定時は直前のX.Y.0）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  GO_VERSION: "1.27"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend applications
        run: |
          set -euo pipefail
          for app in frontend auth admin info contact help; do
            npm --prefix "${app}" ci --include=optional
            npm --prefix "${app}" audit --audit-level=high
            npm --prefix "${app}" run build
          done

  migrate:
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    env:
      APP_ENV: prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Migrate database
        working-directory: backend
        run: go run ./cmd/migrate

  deploy:
    needs: [validate, migrate]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN}"
          test -n "${RAILWAY_PROJECT_ID}"
          test -n "${RAILWAY_SERVICE_ID}"
          test -n "${RAILWAY_ENVIRONMENT}"
          npm install --global @railway/cli
          railway up . \
            --path-as-root \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_SERVICE_ID}" \
            --ci

      - name: Deploy Vercel projects
        env:
          VERCEL_TOKEN_FRONTEND: ${{ secrets.VERCEL_TOKEN_FRONTEND }}
          VERCEL_TOKEN_AUTH: ${{ secrets.VERCEL_TOKEN_AUTH }}
          VERCEL_TOKEN_ADMIN: ${{ secrets.VERCEL_TOKEN_ADMIN }}
          VERCEL_TOKEN_INFO: ${{ secrets.VERCEL_TOKEN_INFO }}
          VERCEL_TOKEN_CONTACT: ${{ secrets.VERCEL_TOKEN_CONTACT }}
          VERCEL_TOKEN_HELP: ${{ secrets.VERCEL_TOKEN_HELP }}
          VERCEL_ORG_ID_FRONTEND: ${{ secrets.VERCEL_ORG_ID_FRONTEND }}
          VERCEL_ORG_ID_AUTH: ${{ secrets.VERCEL_ORG_ID_AUTH }}
          VERCEL_ORG_ID_ADMIN: ${{ secrets.VERCEL_ORG_ID_ADMIN }}
          VERCEL_ORG_ID_INFO: ${{ secrets.VERCEL_ORG_ID_INFO }}
          VERCEL_ORG_ID_CONTACT: ${{ secrets.VERCEL_ORG_ID_CONTACT }}
          VERCEL_ORG_ID_HELP: ${{ secrets.VERCEL_ORG_ID_HELP }}
          VERCEL_PROJECT_ID_FRONTEND: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_PROJECT_ID_AUTH: ${{ secrets.VERCEL_PROJECT_ID_AUTH }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          VERCEL_PROJECT_ID_INFO: ${{ secrets.VERCEL_PROJECT_ID_INFO }}
          VERCEL_PROJECT_ID_CONTACT: ${{ secrets.VERCEL_PROJECT_ID_CONTACT }}
          VERCEL_PROJECT_ID_HELP: ${{ secrets.VERCEL_PROJECT_ID_HELP }}
        run: |
          set -euo pipefail
          declare -A projects=(
            [frontend]="${VERCEL_PROJECT_ID_FRONTEND}"
            [auth]="${VERCEL_PROJECT_ID_AUTH}"
            [admin]="${VERCEL_PROJECT_ID_ADMIN}"
            [info]="${VERCEL_PROJECT_ID_INFO}"
            [contact]="${VERCEL_PROJECT_ID_CONTACT}"
            [help]="${VERCEL_PROJECT_ID_HELP}"
          )
          declare -A tokens=(
            [frontend]="${VERCEL_TOKEN_FRONTEND}"
            [auth]="${VERCEL_TOKEN_AUTH}"
            [admin]="${VERCEL_TOKEN_ADMIN}"
            [info]="${VERCEL_TOKEN_INFO}"
            [contact]="${VERCEL_TOKEN_CONTACT}"
            [help]="${VERCEL_TOKEN_HELP}"
          )
          declare -A orgs=(
            [frontend]="${VERCEL_ORG_ID_FRONTEND}"
            [auth]="${VERCEL_ORG_ID_AUTH}"
            [admin]="${VERCEL_ORG_ID_ADMIN}"
            [info]="${VERCEL_ORG_ID_INFO}"
            [contact]="${VERCEL_ORG_ID_CONTACT}"
            [help]="${VERCEL_ORG_ID_HELP}"
          )
          for app in frontend auth admin info contact help; do
            test -n "${projects[$app]}"
            test -n "${tokens[$app]}"
            test -n "${orgs[$app]}"
            (
              cd "${app}"
              npx --yes vercel@latest link --yes \
                --project "${projects[$app]}" \
                --scope "${orgs[$app]}" \
                --token "${tokens[$app]}"
              npx --yes vercel@latest pull --yes \
                --environment=production \
                --scope "${orgs[$app]}" \
                --token "${tokens[$app]}"
              npx --yes vercel@latest build --prod \
                --scope "${orgs[$app]}" \
                --token "${tokens[$app]}"
              npx --yes vercel@latest deploy --prebuilt --prod \
                --scope "${orgs[$app]}" \
                --token "${tokens[$app]}"
            )
          done

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          RELEASE_MAJOR: ${{ inputs.major }}
          RELEASE_MINOR: ${{ inputs.minor }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_MAJOR}" && -n "${RELEASE_MINOR}" ]]; then
            echo "major and minor cannot be specified at the same time" >&2
            exit 1
          fi

          if [[ -n "${RELEASE_MAJOR}" && ! "${RELEASE_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "major must be a non-negative integer" >&2
            exit 1
          fi

          if [[ -n "${RELEASE_MINOR}" && ! "${RELEASE_MINOR}" =~ ^[0-9]+$ ]]; then
            echo "minor must be a non-negative integer" >&2
            exit 1
          fi

          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "${previous}" ]]; then
            previous="v0.0.0"
          fi

          if [[ ! "${previous}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "latest version tag has an invalid format: ${previous}" >&2
            exit 1
          fi

          previous_major="${BASH_REMATCH[1]}"
          previous_minor="${BASH_REMATCH[2]}"
          previous_patch="${BASH_REMATCH[3]}"

          if [[ -n "${RELEASE_MAJOR}" ]]; then
            version="${RELEASE_MAJOR}.0.0"
          elif [[ -n "${RELEASE_MINOR}" ]]; then
            version="${previous_major}.${RELEASE_MINOR}.0"
          else
            version="${previous_major}.${previous_minor}.$((previous_patch + 1))"
          fi

          tag="v${version}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            echo "release tag already exists: ${tag}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
