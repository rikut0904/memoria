services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoriapass
      POSTGRES_DB: memoria_db
    ports:
      - "25432:5432"
    volumes:
      - memoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack:1.5.13
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-1
      PERSIST_STATE: "1"
      STATE_DIR: /data/ministack-state
    ports:
      - "24566:4566"
    volumes:
      - memoria_ministack_data:/data
      - ./docker/ministack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test
          AWS_DEFAULT_REGION=ap-northeast-1
          aws --endpoint-url=http://localhost:4566 s3api head-bucket
          --bucket memoria-local >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env.local
        required: false
      - path: ./auth/.env.local
        required: false
    environment:
      APP_ENV: local
      APP_PORT: 28080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: memoria
      DB_PASSWORD: memoriapass
      DB_NAME: memoria_db
      DB_SSLMODE: disable
      DATABASE_URL: ""
      AWS_ENDPOINT: http://ministack:4566
      AWS_REGION: ap-northeast-1
      S3_BUCKET: memoria-local
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      SES_FROM_EMAIL: no-reply@memoria.local
      FRONTEND_BASE_URL: http://localhost:23000
      ALLOWED_ORIGINS: http://localhost:23000,http://localhost:23001,http://localhost:23002,http://localhost:23003,http://localhost:23004,http://localhost:23005
    ports:
      - "28080:28080"
    volumes:
      - ./backend/templates:/app/templates:ro
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_ADMIN_BASE_URL: http://localhost:23002
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:23001
        NEXT_PUBLIC_INFO_BASE_URL: http://localhost:23004
        NEXT_PUBLIC_HELP_BASE_URL: http://localhost:23003
        NEXT_PUBLIC_CONTACT_BASE_URL: http://localhost:23005
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      PORT: 23000
    ports:
      - "23000:23000"
    depends_on:
      backend:
        condition: service_started

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_APP_BASE_URL: http://localhost:23000
        NEXT_PUBLIC_ADMIN_BASE_URL: http://localhost:23002
        NEXT_PUBLIC_HELP_BASE_URL: http://localhost:23003
        NEXT_PUBLIC_INFO_BASE_URL: http://localhost:23004
        NEXT_PUBLIC_CONTACT_BASE_URL: http://localhost:23005
        NEXT_PUBLIC_APP_ENV: local
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    env_file:
      - path: ./auth/.env.local
        required: false
    environment:
      PORT: 23001
    ports:
      - "23001:23001"
    depends_on:
      backend:
        condition: service_started

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_APP_BASE_URL: http://localhost:23000
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:23001
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      PORT: 23002
    ports:
      - "23002:23002"
    depends_on:
      backend:
        condition: service_started

  help:
    build:
      context: ./help
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_APP_BASE_URL: http://localhost:23000
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:23001
        NEXT_PUBLIC_HELP_BASE_URL: http://localhost:23003
        NEXT_PUBLIC_INFO_BASE_URL: http://localhost:23004
        NEXT_PUBLIC_CONTACT_BASE_URL: http://localhost:23005
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      PORT: 23003
    ports:
      - "23003:23003"
    depends_on:
      backend:
        condition: service_started

  info:
    build:
      context: ./info
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_APP_BASE_URL: http://localhost:23000
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:23001
        NEXT_PUBLIC_HELP_BASE_URL: http://localhost:23003
        NEXT_PUBLIC_INFO_BASE_URL: http://localhost:23004
        NEXT_PUBLIC_CONTACT_BASE_URL: http://localhost:23005
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      PORT: 23004
    ports:
      - "23004:23004"
    depends_on:
      backend:
        condition: service_started

  contact:
    build:
      context: ./contact
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:28080
        NEXT_PUBLIC_APP_BASE_URL: http://localhost:23000
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:23001
        NEXT_PUBLIC_INFO_BASE_URL: http://localhost:23004
        NEXT_PUBLIC_HELP_BASE_URL: http://localhost:23003
        NEXT_PUBLIC_CONTACT_BASE_URL: http://localhost:23005
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      PORT: 23005
    ports:
      - "23005:23005"
    depends_on:
      backend:
        condition: service_started

volumes:
  memoria_postgres_data:
  memoria_ministack_data:
